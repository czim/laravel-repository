name: PHPUnit

on: [push, pull_request]

jobs:
    phpunit:
        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
                laravel: ['11.*', '12.*', '13.*']
                exclude:
                    - php: '8.2'
                      laravel: '13.*'
                    - php: '8.5'
                      laravel: '11.*'
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, mbstring, pdo_sqlite
                  tools: composer:v2
                  coverage: none

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

            - name: Install dependencies
              run: |
                  composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
                  composer update --no-interaction --prefer-dist --prefer-stable

            - name: Run PHPUnit
              run: composer test
